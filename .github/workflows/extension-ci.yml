name: extension-paper-ci

# Lint, typecheck, and the fast test tier for extension_paper/ on every
# push and PR. The slow, full-statistical-power experiment runs
# (`make experiments` in extension_paper/) are NOT part of this workflow by
# design -- see extension_paper/README.md's "Test tiers" section: they are
# an explicit, manual step for regenerating the results package, not a CI
# gate.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension_paper
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extension_paper (editable) + dev/runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-extension.txt

      - name: Lint (black --check, ruff check)
        run: |
          black --check .
          ruff check .

      - name: Typecheck (mypy --strict on src/amu_ext)
        run: mypy

      - name: Fast tests (unit + integration smoke; excludes `slow`)
        run: python -m pytest tests/ -v

      - name: Coverage report
        run: python -m pytest tests/ --cov=amu_ext --cov-report=term-missing
